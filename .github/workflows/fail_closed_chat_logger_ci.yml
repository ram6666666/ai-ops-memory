name: Fail-Closed Chat Logger CI

on:
  push:
    paths:
      - 'tools/fail_closed_chat_logger.py'
      - 'tools/test_fail_closed_chat_logger.py'
      - 'tools/fail_closed_chat_runtime.py'
      - 'tools/test_fail_closed_chat_runtime.py'
      - 'tools/fail_closed_chat_runtime_v2.py'
      - 'tools/test_fail_closed_chat_runtime_v2.py'
      - 'tools/github_contents_replica_sink.py'
      - 'tools/live_github_replica_smoke.py'
      - 'tools/google_drive_replica_sink.py'
      - 'tools/test_google_drive_replica_sink.py'
      - '.github/workflows/fail_closed_chat_logger_ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install current OpenAI Python SDK
        run: python -m pip install --upgrade openai
      - name: Verify current Responses SDK surface exists
        env:
          OPENAI_API_KEY: sk-ci-surface-check-not-a-live-key
        run: |
          python - <<'PY'
          from openai import OpenAI
          client = OpenAI()
          assert callable(client.responses.create)
          assert callable(client.responses.retrieve)
          print('responses.create/retrieve surfaces available')
          PY
      - name: Run original prototype tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          cd tools
          python -m unittest -v test_fail_closed_chat_logger.py
      - name: Run production candidate v1 tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          cd tools
          python -m unittest -v test_fail_closed_chat_runtime.py
      - name: Run durable-outbox v2 candidate tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          cd tools
          python -m unittest -v test_fail_closed_chat_runtime_v2.py
      - name: Run Google Drive ReplicaSink controlled tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          cd tools
          python -m unittest -v test_google_drive_replica_sink.py
      - name: Compile candidates and replica sinks
        run: |
          python -m py_compile \
            tools/fail_closed_chat_runtime.py \
            tools/test_fail_closed_chat_runtime.py \
            tools/fail_closed_chat_runtime_v2.py \
            tools/test_fail_closed_chat_runtime_v2.py \
            tools/github_contents_replica_sink.py \
            tools/live_github_replica_smoke.py \
            tools/google_drive_replica_sink.py \
            tools/test_google_drive_replica_sink.py
      - name: Live GitHub network ReplicaSink write-readback-cleanup smoke
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          cd tools
          python live_github_replica_smoke.py
